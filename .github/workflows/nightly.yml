# Every night, the signed build of main, if main has moved (ARCHITECTURE.md, section 10).
name: Nightly
on:
  schedule:
    # 02:23 in the Pacific winter, 03:23 in its summer.
    - cron: "23 10 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
defaults:
  run:
    shell: bash
env:
  GH_REPO: ${{ github.repository }}
  TAG: nightly
jobs:
  # The published nightly says in its notes which commit it was built from. Notes that cannot be read, or that name
  # another commit, mean a nightly is due.
  moved:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.compare.outputs.commit }}
      moved: ${{ steps.compare.outputs.moved }}
    steps:
      - name: Has main moved since the last nightly
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          notes=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .body 2> /dev/null) || notes=""
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          case "$notes" in
            *"built from $commit."*)
              echo "moved=false" >> "$GITHUB_OUTPUT"
              echo "main has not moved since the last nightly" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "moved=true" >> "$GITHUB_OUTPUT" ;;
          esac
  package:
    needs: moved
    if: needs.moved.outputs.moved == 'true'
    uses: ./.github/workflows/package.yml
    # What Package's jobs may ask for: a called workflow gets no more than the job that calls it.
    permissions:
      contents: read
      actions: read
    with:
      channel: nightly
      commit: ${{ needs.moved.outputs.commit }}
    secrets: inherit
  # There is one nightly release, and each night's build takes its place in it: the image under its plain name, the
  # same image under a name of its own, and the feed, which gives that second address. The name of its own holds the
  # build number and the start of the image's SHA-256, so a published image is never replaced by other bytes: an
  # app that was offered it is given it, even after the same commit has been built again. The images of the last
  # $KEEP builds stay. The tag is moved to the commit this one was built from before anything is published, so a
  # nightly is never published on a tag that is on another commit. The notes, which say what the nightly was built
  # from, are written last: if a step here fails, the next run builds and publishes again. Whether the release and
  # the tag are there is read from lists: an answer that could not be had stops the job, and never passes for "no".
  publish:
    needs: [moved, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.dmg }}
      - name: Publish the nightly
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.moved.outputs.commit }}
          VERSION: ${{ needs.package.outputs.version }}
          BUILD: ${{ needs.package.outputs.build }}
          DMG: ${{ needs.package.outputs.dmg }}
          SHA256: ${{ needs.package.outputs.sha256 }}
          FEED_SHA256: ${{ needs.package.outputs.feed_sha256 }}
          # How many builds' own images stay, this one included: about a month of nightlies. An app that has held
          # an offer open for longer is told the download failed, and its next check offers the newest build.
          KEEP: 30
        run: |
          echo "$SHA256  $DMG" | shasum -a 256 --check
          echo "$FEED_SHA256  appcast.xml" | shasum -a 256 --check
          own="${DMG%.dmg}-$BUILD-${SHA256:0:12}.dmg"
          cp "$DMG" "$own"
          notes="Version $VERSION ($BUILD), built from $COMMIT. Signed with the Developer ID and notarized by Apple.

          SHA-256 of $DMG: $SHA256"
          releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | "\(.id) \(.tag_name)"' \
            | awk -v tag="$TAG" '$2 == tag { print $1 }')
          tags=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" --jq '.[].ref')
          if grep -Fxq "refs/tags/$TAG" <<< "$tags"; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$COMMIT" -F force=true > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$COMMIT" > /dev/null
          fi
          [ "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)" = "$COMMIT" ]
          if [ -z "$releases" ]; then
            gh release create "$TAG" "$own" appcast.xml "$DMG" --verify-tag --prerelease --title "Sorello Nightly" \
              --notes "$notes"
            exit 0
          fi
          release=$(head -n 1 <<< "$releases")
          for id in $(tail -n +2 <<< "$releases"); do gh api --method DELETE "repos/$GH_REPO/releases/$id"; done
          list() {
            gh api --paginate "repos/$GH_REPO/releases/$release/assets?per_page=100" \
              --jq '.[] | "\(.id) \(.name) \(.state)"'
          }
          # The image's own name goes up before the feed that gives it. One that is already there in full holds
          # these bytes, by its name, and is left as it is; one whose upload was cut short is cleared away first.
          assets=$(list)
          there=$(awk -v name="$own" '$2 == name { print $1, $3 }' <<< "$assets")
          case "$there" in
            *" uploaded") ;;
            "") gh release upload "$TAG" "$own" ;;
            *)
              gh api --method DELETE "repos/$GH_REPO/releases/assets/${there%% *}"
              gh release upload "$TAG" "$own"
              ;;
          esac
          gh release upload "$TAG" appcast.xml "$DMG" --clobber
          # What goes: the own images of builds older than the last $KEEP, and anything an earlier nightly left
          # that is not one of this nightly's files.
          own_name="^${DMG%.dmg}-([0-9]+)-[0-9a-f]{12}\.dmg$"
          assets=$(list)
          kept=$(awk '{ print $2 }' <<< "$assets" | sed -nE "s/$own_name/\1/p" | sort -rnu | head -n "$KEEP")
          grep -Fxq "$BUILD" <<< "$kept"
          while read -r id name _; do
            case "$name" in ""|"$DMG"|appcast.xml) continue ;; esac
            number=$(sed -nE "s/$own_name/\1/p" <<< "$name")
            if [ -n "$number" ] && grep -Fxq "$number" <<< "$kept"; then continue; fi
            gh api --method DELETE "repos/$GH_REPO/releases/assets/$id"
          done <<< "$assets"
          # A release left as a draft by a publication that was cut short is published here.
          gh release edit "$TAG" --draft=false --prerelease --title "Sorello Nightly" --notes "$notes"
